---
# No Docker on the container: the role must say so and do nothing.
- name: Converge (audit only)
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Audit
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../.."  # noqa: role-name[path]
      vars:
        linux_hardening_mode: audit
        linux_hardening_fail_on_error: false
    - name: No findings without Docker
      ansible.builtin.assert:
        that: linux_hardening_container_findings == []
        quiet: true
    - name: Nothing was written
      ansible.builtin.stat:
        path: /etc/docker
      register: __f
      failed_when: __f.stat.exists
