---
- name: audit | Gather Docker state
  ansible.builtin.include_tasks: facts.yml

# Each task below adds one finding to the list when its check fails; read top to bottom.
- name: audit | Start with no findings
  ansible.builtin.set_fact:
    linux_hardening_container_findings: []

- name: audit | Report an unparseable daemon.json (never overwritten)
  ansible.builtin.set_fact:
    linux_hardening_container_findings: "{{ linux_hardening_container_findings + [finding] }}"
  vars:
    finding:
      key: "daemon.json {{ linux_hardening_container_config }}"
      expected: a JSON object
      actual: "not valid JSON (reported only: the role will not overwrite it)"
      fixable: false
  when: not __lh_ct_json_ok

- name: audit | Report managed daemon.json keys that differ
  ansible.builtin.set_fact:
    linux_hardening_container_findings: "{{ linux_hardening_container_findings + [finding] }}"
  vars:
    finding:
      key: "daemon.json {{ item }}"
      expected: "{{ linux_hardening_container_daemon[item] | to_json }}"
      actual: "{{ (__lh_ct_cur[item] | to_json) if item in __lh_ct_cur else 'unset' }}"
      fixable: true
  loop: "{{ __lh_ct_diff if __lh_ct_json_ok else [] }}"

- name: audit | Report a configuration directory or file that is not root-owned and locked down
  vars:
    __lh_ct_dir: "{{ __lh_ct_stats.results[0].stat }}"
    __lh_ct_cfg: "{{ __lh_ct_stats.results[1].stat }}"
  block:
    - name: audit | Check the configuration directory
      ansible.builtin.set_fact:
        linux_hardening_container_findings: "{{ linux_hardening_container_findings + [finding] }}"
      vars:
        finding:
          key: "directory {{ __linux_hardening_container_dir }}"
          expected: root-owned, not writable by group or others
          actual: "{{ __lh_ct_dir.pw_name }} {{ __lh_ct_dir.mode }}"
          fixable: true
      when:
        - __lh_ct_dir.exists
        - __lh_ct_dir.pw_name != 'root' or __lh_ct_dir.mode[-2:] not in ['55', '50', '00', '40']

    - name: audit | Check the configuration file
      ansible.builtin.set_fact:
        linux_hardening_container_findings: "{{ linux_hardening_container_findings + [finding] }}"
      vars:
        finding:
          key: "file {{ linux_hardening_container_config }}"
          expected: root-owned, 0644 or stricter
          actual: "{{ __lh_ct_cfg.pw_name }} {{ __lh_ct_cfg.mode }}"
          fixable: true
      when:
        - __lh_ct_cfg.exists
        - __lh_ct_cfg.pw_name != 'root' or __lh_ct_cfg.mode[-2:] not in ['44', '40', '00']

- name: audit | Report a running daemon that has not picked up daemon.json
  ansible.builtin.set_fact:
    linux_hardening_container_findings: "{{ linux_hardening_container_findings + [finding] }}"
  vars:
    finding:
      key: running daemon applies daemon.json
      expected: live-restore, log-driver and icc as configured
      actual: >-
        stale: {{ __lh_ct_stale | join(', ') }}{{ '' if linux_hardening_container_restart | bool
        else ' (restart dockerd: set linux_hardening_container_restart)' }}
      fixable: "{{ (linux_hardening_container_restart | bool) and __lh_ct_unit.status.ActiveState | default('') == 'active' }}"
  when:
    - __lh_ct_diff | length == 0
    - __lh_ct_json_ok
    - __lh_ct_stale | length > 0

- name: audit | Report an unencrypted Docker API
  ansible.builtin.set_fact:
    linux_hardening_container_findings: "{{ linux_hardening_container_findings + [finding] }}"
  vars:
    finding:
      key: unencrypted Docker API
      expected: nothing listening on tcp/2375
      actual: "listening (reported only: use a socket or TLS)"
      fixable: false
  when: __lh_ct_tcp.stdout | default('') | trim | length > 0

- name: audit | Report docker group members that are not allowed
  ansible.builtin.set_fact:
    linux_hardening_container_findings: "{{ linux_hardening_container_findings + [finding] }}"
  vars:
    __lh_ct_members: >-
      {{ (__lh_ct_group.ansible_facts.getent_group.docker[2] | default('')).split(',') | select
         | difference(linux_hardening_container_docker_group_allowed) if __lh_ct_group.ansible_facts is defined else [] }}
    finding:
      key: docker group members
      expected: only trusted users (root-equivalent)
      actual: "{{ __lh_ct_members | join(', ') }} (reported only)"
      fixable: false
  when: __lh_ct_members | length > 0

- name: audit | Report container_hardening result
  ansible.builtin.debug:
    msg: "{{ 'COMPLIANT' if linux_hardening_container_findings | length == 0 else linux_hardening_container_findings }}"

# After remediation only fixable findings fail the run.
- name: audit | Fail on findings
  ansible.builtin.fail:
    msg: "container_hardening found {{ __lh_ct_blocking | length }} deviation(s)."
  vars:
    __lh_ct_blocking: >-
      {{ linux_hardening_container_findings
         if (linux_hardening_fail_on_error | bool) and not (__lh_ct_audit_fatal | default(false))
         else linux_hardening_container_findings | selectattr('fixable') | list
         if (__lh_ct_audit_fatal | default(false)) else [] }}
  when: __lh_ct_blocking | length > 0
