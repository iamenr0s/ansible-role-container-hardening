---
- name: configure | Gather Docker state
  ansible.builtin.include_tasks: facts.yml

- name: configure | Refuse to overwrite a daemon.json that is not JSON
  ansible.builtin.assert:
    that: __lh_ct_json_ok | bool
    fail_msg: "{{ linux_hardening_container_config }} is not a JSON object; fix it by hand, the role will not overwrite it."
    quiet: true

- name: configure | Configuration directory
  ansible.builtin.file:
    path: "{{ __linux_hardening_container_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: >-
    not __lh_ct_stats.results[0].stat.exists or __lh_ct_stats.results[0].stat.pw_name != 'root'
    or __lh_ct_stats.results[0].stat.mode[-2:] not in ['55', '50', '00', '40']

# Written only when a managed key differs (or the file is missing): a correct file keeps its own formatting. Other keys
# are carried over. dockerd checks the file first when it knows how, so a bad key cannot stop the daemon at the next start.
- name: configure | Write daemon.json
  ansible.builtin.copy:
    content: "{{ __lh_ct_desired | to_nice_json(indent=2) }}\n"
    dest: "{{ linux_hardening_container_config }}"
    owner: root
    group: root
    mode: '0644'
    backup: "{{ linux_hardening_backup | bool }}"
    validate: "{{ (__lh_ct_dockerd_bin ~ ' --validate --config-file=%s') if '--validate' in __lh_ct_help.stdout | default('') else omit }}"
  when: __lh_ct_diff | length > 0 or not __lh_ct_stats.results[1].stat.exists
  register: __lh_ct_written

- name: configure | Tighten the permissions of an existing file
  ansible.builtin.file:
    path: "{{ linux_hardening_container_config }}"
    owner: root
    group: root
    mode: '0644'
  when: __lh_ct_stats.results[1].stat.exists and __lh_ct_stats.results[1].stat.mode[-2:] not in ['44', '40', '00']

# Restarts stop every container unless live-restore is already on, so only with consent. A stopped daemon is left stopped.
- name: configure | Restart dockerd so the configuration takes effect
  ansible.builtin.systemd:
    name: docker
    state: restarted
  when:
    - linux_hardening_container_restart | bool
    - __lh_ct_unit.status.ActiveState | default('') == 'active'
    - __lh_ct_written is changed or __lh_ct_stale | length > 0
  register: __lh_ct_restarted

- name: configure | Wait for the daemon to answer  # noqa: no-handler
  ansible.builtin.command: docker info
  register: __lh_ct_ready
  changed_when: false
  retries: 30
  delay: 2
  until: __lh_ct_ready.rc == 0
  when: __lh_ct_restarted is changed
