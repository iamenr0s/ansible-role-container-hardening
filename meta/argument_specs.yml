---
argument_specs:
  main:
    short_description: Audit and set the Docker daemon host configuration without restarting it unasked.
    options:
      linux_hardening_mode: {type: str, default: audit, choices: [audit, remediate], description: "audit is read-only."}
      linux_hardening_confirm_remediation: {type: bool, default: false, description: "Must be true before remediate changes anything."}
      linux_hardening_backup: {type: bool, default: true, description: "Back up daemon.json when it changes."}
      linux_hardening_verify: {type: bool, default: true, description: "Re-audit after remediation."}
      linux_hardening_fail_on_error: {type: bool, default: true, description: "Fail the play when audit finds deviations."}
      linux_hardening_container_enabled: {type: bool, default: true, description: "Run the role."}
      linux_hardening_container_config: {type: path, default: /etc/docker/daemon.json, description: "Docker daemon configuration file."}
      linux_hardening_container_daemon:
        type: dict
        description: "daemon.json keys this role owns, with exact values; other keys are kept."
        default:
          icc: false
          no-new-privileges: true
          live-restore: true
          userland-proxy: false
          log-driver: json-file
          log-opts: {max-size: 10m, max-file: '3'}
      linux_hardening_container_restart: {type: bool, default: false, description: "Allow restarting dockerd so the configuration takes effect."}
      linux_hardening_container_docker_group_allowed: {type: list, elements: str, default: [], description: "Users allowed in the docker group; others are reported."}
